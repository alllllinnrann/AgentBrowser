name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Read version
        id: version
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag must match package.json version v$version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install locked dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run check

      - name: Build installer
        run: npm run package

      - name: Record checksum and build source
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installer = "outputs/releases/AgentBrowser-Setup-$env:APP_VERSION-x64.exe"
          if (!(Test-Path -LiteralPath $installer)) { throw 'Installer was not generated' }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AgentBrowser-Setup-$env:APP_VERSION-x64.exe" | Set-Content "outputs/releases/SHA256SUMS-$env:APP_VERSION.txt" -Encoding ascii
          @{
            version = $env:APP_VERSION
            repository = $env:GITHUB_REPOSITORY
            commit = $env:GITHUB_SHA
            ref = $env:GITHUB_REF
            run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            signed = $false
          } | ConvertTo-Json | Set-Content outputs/releases/build-info.json -Encoding utf8

      - name: Upload installer bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AgentBrowser-${{ steps.version.outputs.version }}-windows-x64
          path: |
            outputs/releases/AgentBrowser-Setup-*-x64.exe
            outputs/releases/SHA256SUMS-*.txt
            outputs/releases/build-info.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
